            url: https://github.com/Cez02/LOD-terrain-renderer-thesis
          # - icon: fab fa-twitter
          #   url: https://twitter.com/intent/tweet?text=Check+it+out:&url=https%3A%2F%2Fgithub.com%2Fgurusabarish%2Fhugo-profile

      - title: Bidirectional pathtracer
        content: A bidirectional spectral pathtracer written for the Realistic Computer Graphics course. As per a course task a custom implementation of KD-trees was also implemented, though worse than Embree solutions.
        image: /images/projects/pathtracer.png
        featured:
          name: Repo
          link: https://github.com/Cez02/RCGWorkshops
        badges:
          - "Embree 4"
          - "Pathtracing"
          - "Spectral color handling"
          - "EXR"
        links:
          # - icon: fa fa-envelope
