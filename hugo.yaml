  # projects
  projects:
    enable: true
    # title: "Custom Name"
    items:
      - title: BEng Terrain Renderer Thesis
        content: |-
          A terrain renderer written in Vulkan that uses mesh shaders for autotomatic LOD scaling.
          
          It pushed the SRTM data straight to the mesh shader which then generated geometry. It was generally quite ok however due to time constraints many potential optimizations weren't implemented.
        
        image: /images/projects/terrainRenderer.png
        featured:
          name: Repo
          link: https://github.com/Cez02/LOD-terrain-renderer-thesis
        badges:
          - "Vulkan"
          - "Mesh Shaders"
          - "SRTM Data"
          - "Automatic LOD"
        links:
          # - icon: fa fa-envelope
          #   url: mailto:?subject=Hugo%20Profile%20Template&body=Check%20it%20out:%20https%3a%2f%2fhugo-profile.netlify.app%2fblog%2fmarkdown-syntax%2f
